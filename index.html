<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #navbar {
      width: 100%;
      background-color: #1a1a1a;
      border-bottom: 1px solid #444;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 30px;
      padding: 18px 30px;
    }

    .nav-container a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .nav-container a:hover {
      color: #aaa;
    }

    main {
      padding: 40px 30px;
    }
  </style>
</head>

<body>

  <!-- NAVIGATION MUST COME FIRST -->
  <div id="navbar"></div>

  <main>
    <h1>About Me</h1>

    <p>
      I am a marketing student at Iowa State University with experience in
      sales, insurance, and customer relationships. Outside of school and work,
      I enjoy motorcycles, fishing, spending time outdoors, and working on
      personal projects.
    </p>
  </main>

  <script src="navigation.js"></script>

</body>
</html>
